[pytest]
# ⚠ WHY (§4BV R7 lens C, added 2026-08-19). Without a per-test cap, whole
# classes of budget/deadline mutations degrade into "CI hangs forever"
# instead of "test fails": one mutation hung a run indefinitely (both halves
# of the keepalive gate bypass removed), another stretched a single file
# from 85s to 671s and still read as green. 300s is ~10x the slowest
# legitimate test (~32s, in test_llm_contention_fixes.py, which holds real
# permits); anything past it is a defect, not a slow test. Raise per-test
# with @pytest.mark.timeout(...) if a genuinely longer test ever exists.
timeout = 300
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
