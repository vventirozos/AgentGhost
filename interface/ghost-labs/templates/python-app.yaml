name: python-app
description: "One Python app box (/opt/venv with flask + gunicorn), port 8080 published, Tor egress. The app must listen on 0.0.0.0:$PORT (8080; a server bound to 127.0.0.1 is not reachable from outside the member). Kept: every deploy installs requirements.txt into the app folder (.deps) before the switch — run the app with plain python3 (python3 -I ignores .deps). A static site belongs in a static-site lab"
egress: tor
members:
  - {name: app, image: "ghost-lab/python-app:1", mem_mb: 384, cpus: 1.0, ports: [8080]}
readiness: {member: app, cmd: "true", timeout_s: 30}
app:
  member: app
  port: 8080
  health: {http: "/"}
